name: collect

on:
  schedule:
    # Six slots an hour, off the hour. GitHub starts scheduled runs late and drops many of them: with two slots an
    # hour only one ever ran, and on 2026-11-18 none did for over five hours. So there are more slots than wanted
    # runs, and the step "Decide whether to collect" ends a scheduled run at once unless the last snapshot is at
    # least 23 minutes old. That keeps the pace at one collection every 30 minutes at most.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    # New collector code or a new workflow is tried at once.
    branches-ignore: [data]
    paths: ["collector/**", ".github/workflows/collect.yml"]

permissions:
  contents: write # push snapshots to the data branch
  actions: write  # re-enable this workflow so the 60-day inactivity rule never pauses it

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPO_URL: https://github.com/${{ github.repository }}.git
    steps:
      - name: Get code and data
        run: |
          git config --global credential.helper '!f() { echo username=x-access-token; echo "password=${GITHUB_TOKEN}"; }; f'
          git config --global advice.detachedHead false
          git init -q code
          git -C code fetch -q --depth 1 "$REPO_URL" "$GITHUB_SHA"
          git -C code checkout -q FETCH_HEAD
          if git ls-remote --exit-code --heads "$REPO_URL" data >/dev/null 2>&1; then
            git clone -q --depth 1 --branch data "$REPO_URL" data
          else
            git init -q -b data data
            git -C data remote add origin "$REPO_URL"
          fi

      - name: Decide whether to collect
        id: gate
        run: |
          # A scheduled run collects only when the last snapshot is 23 minutes old and nothing was tried in the last
          # 15 (so a failing run is not repeated every 10 minutes). A manual run or a push of new code always collects.
          ages=$(python3 -c "import json,time; s=json.load(open('data/status.json')); n=time.time(); print(int(n-(s.get('lastOk') or 0)), int(n-(s.get('lastAttempt') or 0)))" 2>/dev/null || echo "999999 999999")
          set -- $ages
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && { [ "$1" -lt 1380 ] || [ "$2" -lt 900 ]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skipping: last snapshot $1 s ago, last attempt $2 s ago"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "collecting ($GITHUB_EVENT_NAME): last snapshot $1 s ago, last attempt $2 s ago"
          fi

      - name: Test
        if: steps.gate.outputs.run == 'true'
        working-directory: code
        run: python3 -m unittest discover -s tests -t . 2>&1 | tail -4

      - name: Collect
        id: collect
        if: steps.gate.outputs.run == 'true'
        working-directory: code
        run: |
          set +e
          python3 -m collector.collect --data ../data
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Roll up and summarize
        id: rollup
        if: steps.gate.outputs.run == 'true'
        working-directory: code
        run: |
          python3 -m collector.rollup --data ../data
          python3 -m collector.summarize --data ../data

      - name: Save
        if: steps.gate.outputs.run == 'true'
        working-directory: data
        env:
          ROLLED: ${{ steps.rollup.outputs.rolled }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to save"
            exit 0
          fi
          stamp="$(date -u +%Y-%m-%dT%H:%MZ)"
          if [ "$ROLLED" = "true" ]; then
            # Once a day the branch history is replaced by a single commit, so the
            # repository stays small no matter how long the collector runs.
            git checkout -q --orphan fresh
            git add -A
            git commit -q -m "data: $stamp (history squashed)"
            git push -q --force origin HEAD:data
          else
            git commit -q -m "data: $stamp"
            git push -q origin HEAD:data
          fi
          du -sh --exclude=.git . | sed 's/^/data size: /'

      - name: Keep the schedule alive
        if: steps.rollup.outputs.rolled == 'true'
        run: |
          curl -fsS -o /dev/null -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/collect.yml/enable" || true

      - name: Flag a failed run
        if: steps.gate.outputs.run == 'true' && steps.collect.outputs.exit != '0'
        run: |
          echo "::error::Collection failed, no snapshot was saved. Details are in status.json on the data branch."
          exit 1
